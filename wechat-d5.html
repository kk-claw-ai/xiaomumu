<div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top, rgba(0,0,0,0.65), transparent);padding:40px 25px 25px 25px;">
<p style="margin:0 0 6px 0;font-size:12px;color:rgba(255,255,255,0.75);letter-spacing:4px;">夏 日 旅 笔</p>
<p style="margin:0;font-size:22px;color:#fff;font-weight:bold;letter-spacing:2px;">白鹿洞与浔阳江</p>
</div>
</div>
<p style="margin:0 0 22px 0;font-size:17px;color:#2b2b2b;line-height:1.85;letter-spacing:0.5px;font-weight:500;text-align:center;">南昌的清晨，是从一碗拌粉开始的。</p>
<p style="margin:0 0 18px 0;font-size:15px;color:#3f3f3f;line-height:1.9;letter-spacing:0.3px;">周真真的店面不起眼，混在写字楼一楼，却挤满了人。进进出出，随意丢弃的餐巾纸散落在角落，人头攒动。有人站着嗦粉，姿态随意，却透着股利落劲儿。点单极快，只说两个字：拌粉。</p>
<p style="margin:0 0 18px 0;font-size:15px;color:#3f3f3f;line-height:1.9;letter-spacing:0.3px;">入口是实实在在的香。为了这口滋味，周遭的嘈杂与环境的不拘小节，都成了可以忍受的背景音。</p>
<p style="margin:0 0 18px 0;font-size:15px;color:#3f3f3f;line-height:1.9;letter-spacing:0.3px;">配着拌粉的，还有赤豆元子汤，甜糯适中，温润喉舌。瓦罐煨汤里，肉饼佐以两粒香菇，鲜气逼人。小笼包子并不讲究皮薄如纸，胜在肉质厚实，蘸上那鲜辣的酱汁，拌什么都觉着香。</p>
